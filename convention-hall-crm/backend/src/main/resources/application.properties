# Application
spring.application.name=convention-hall-crm
server.port=${PORT:8080}

# MySQL Database (local defaults kept; override via env vars on the server)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/convention_hall_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kavya123reddy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — auto-creates and updates tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JSON date serialisation
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ── Auth ──────────────────────────────────────────────────────────────────────
# Override APP_PASSWORD via environment variable on the server
app.password=${APP_PASSWORD:@nrkfunctionhall}
app.jwt.secret=${JWT_SECRET:NRKFunctionHallCRM-JWT-SecretKey-2026-Min32Chars!}
# Token valid for 30 days (milliseconds)
app.jwt.expiration-ms=2592000000
